name: render
on:
  workflow_dispatch:
    inputs:
      fps:
        description: 'Frames per second'
        default: '30'
      retime:
        description: 'Legacy stretch (HTML timeline already matches VO: keep false)'
        default: 'false'
      skip_qa:
        description: 'Skip vision QA (true/false)'
        default: 'false'
  push:
    paths: ['vo/**']

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Render QA keyframes
        run: |
          npm i puppeteer --no-fund --no-audit
          node scripts/qa-frames.mjs

      - name: Vision QA (advisory — selalu lanjut, hasil di qa-report.md)
        if: inputs.skip_qa != 'true'
        env:
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
        run: python3 scripts/qa-vision.py || true

      - name: Commit QA report
        if: always()
        run: |
          git config user.name "actions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add qa-report.md
          git commit -m "qa: vision report $(date -u +%Y-%m-%dT%H:%M)Z [skip ci]" || echo "no changes"
          git push

  render:
    needs: qa
    # advisory mode: qa job tidak pernah memblokir (QA gagal/issue = info di report)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm i puppeteer --no-fund --no-audit

      - name: Render frames
        run: node scripts/render.mjs "${{ inputs.fps || '30' }}"

      - name: VO retime + mux
        run: |
          audio=$(ls vo/*.wav vo/*.mp3 vo/*.m4a vo/*.ogg 2>/dev/null | head -1)
          if [ -z "$audio" ]; then
            echo "no VO found — silent MP4"
            ffmpeg -y -framerate "${{ inputs.fps || '30' }}" -i out/f_%05d.png -c:v libx264 -pix_fmt yuv420p -crf 20 -preset medium out.mp4
            exit 0
          fi
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$audio")
          RETIME="${{ inputs.retime }}"
          [ -z "$RETIME" ] && RETIME="true"
          # HTML timeline sudah native VO duration -> retime=false berarti langsung mux
          if [ "$RETIME" = "false" ]; then
            ffmpeg -y -framerate "${{ inputs.fps || '30' }}" -i out/f_%05d.png -i "$audio" \
              -map 0:v -map 1:a -c:v libx264 -pix_fmt yuv420p -crf 20 -c:a aac out.mp4
            exit 0
          fi
          echo "retime=$RETIME vo_dur=$dur"
          if [ "$RETIME" = "true" ]; then
            # stretch video 40s -> durasi VO, audio utuh tanpa dipotong
            ffmpeg -y -framerate "${{ inputs.fps || '30' }}" -i out/f_%05d.png -i "$audio" \
              -filter_complex "[0:v]setpts=PTS*($dur/40)[v]" \
              -map "[v]" -map 1:a -c:v libx264 -pix_fmt yuv420p -crf 20 \
              -c:a aac out.mp4
          else
            ffmpeg -y -framerate "${{ inputs.fps || '30' }}" -i out/f_%05d.png -i "$audio" \
              -map 0:v -map 1:a -c:v libx264 -pix_fmt yuv420p -crf 20 -c:a aac -shortest out.mp4
          fi

      - name: Commit MP4
        run: |
          git config user.name "actions-bot"
          git config user.email "actions@users.noreply.github.com"
          git config rerere.enabled false
          git add out.mp4
          git commit -m "render: MP4 $(date -u +%Y-%m-%dT%H:%M)Z [skip ci]" || echo "nothing changed"
          git fetch origin main
          git rebase origin/main --strategy-option=theirs || {
            git rebase --abort
            git rebase -X theirs $(git rev-parse origin/main) 2>/dev/null || true
            git reset --hard origin/main
            git checkout --ours . 2>/dev/null || true
            git add out.mp4
            git commit -m "render: MP4 $(date -u +%Y-%m-%dT%H:%M)Z [skip ci]"
          }
          git push
