name: generate-assets
on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Slug spec (mis. cahaya-matahari) — baca specs/<spec>.assets.json'
        required: true
        type: string
  push:
    paths: ['specs/*.assets.json']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ComfyUI + comfy-cli (CPU fallback, sd-turbo)
        if: ${{ env.REPLICATE_API_TOKEN == '' }}
        run: |
          pip install comfy-cli
          comfy --skip-prompt tracking disable
          comfy install --cpu --fast-deps --skip-requirement || true
          comfy --workspace=$HOME/comfy/ComfyUI --skip-prompt model download \
            --url "https://huggingface.co/stabilityai/sd-turbo/resolve/main/sd_turbo.safetensors" \
            --relative-path models/checkpoints
          ls -la $HOME/comfy/ComfyUI/models/checkpoints/

      - name: Launch ComfyUI headless (fallback)
        if: ${{ env.REPLICATE_API_TOKEN == '' }}
        run: |
          comfy launch --background -- --cpu
          sleep 15
          curl -sf http://127.0.0.1:8188/system_stats | head -c 200

      - name: Generate assets dari spec
        run: |
          # slug: dari input dispatch, atau dari nama file .assets.json yang berubah di push
          if [ -n "${{ inputs.spec }}" ]; then
            SLUG="${{ inputs.spec }}"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep 'specs/.*\.assets\.json' | head -1)
            SLUG=$(basename "$CHANGED" .assets.json)
          fi
          echo "slug=$SLUG"
          test -f "specs/${SLUG}.assets.json" || { echo "spec assets tidak ada: ${SLUG}.assets.json"; exit 1; }
          python3 scripts/generate_assets.py --spec "specs/${SLUG}.assets.json" --output assets/${SLUG}
          ls -la assets/${SLUG}

      - name: Commit assets
        run: |
          git config user.name "actions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "no changes — assets identik"
          else
            git commit -m "assets: generated $(date -u +%Y-%m-%dT%H:%M)Z [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME" || git pull --rebase
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
