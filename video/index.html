<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Gunung Terbalik — Palung Jawa</title>
<style>
  :root{
    --paper:#efe7d3; --ink:#1e2a38; --sea:#2b5f8a; --sea2:#3a7ca5;
    --red:#c0442e; --dim:#8a7f6a; --sand:#c8b78f; --rock:#7a6a52; --deep:#1d4666;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:var(--paper);overflow:hidden;
    font-family:'Liberation Serif','DejaVu Serif',Georgia,serif}
  #stage{position:relative;width:720px;height:1280px;background:var(--paper);overflow:hidden}
  .lyr{position:absolute;inset:0}
  .hidden{opacity:0}
  .tag{position:absolute;top:40px;left:40px;color:var(--dim);font-size:16px;letter-spacing:.26em;font-style:italic;z-index:5}
  .tag b{color:var(--ink);font-weight:400;font-style:normal}
  .dim{color:var(--dim)} .red{color:var(--red)} .sea{color:var(--sea)}
  .sans{font-family:'Liberation Sans','DejaVu Sans',Arial,sans-serif}
  #grat{position:absolute;inset:0;opacity:.45;
    background-image:linear-gradient(rgba(30,42,56,.10) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(30,42,56,.10) 1px,transparent 1px);
    background-size:72px 72px}
  svg{display:block}
  .big{font-weight:700;color:var(--ink)}
  .cap{position:absolute;font-style:italic;color:var(--ink)}
</style>
</head>
<body>
<div id="stage">
  <div id="grat"></div>

  <!-- S1: perahu di atas jurang -->
  <div class="lyr" id="s1">
    <div class="tag">[ FAKTA BUMI ] <b>01/06</b></div>
    <svg width="720" height="1280" viewBox="0 0 720 1280" id="svg1">
      <circle cx="600" cy="180" r="46" fill="#d9a441" opacity=".85"/>
      <g id="cloud1"><ellipse cx="180" cy="170" rx="52" ry="16" fill="#e2d9c2"/><ellipse cx="230" cy="160" rx="40" ry="13" fill="#e2d9c2"/></g>
      <text x="360" y="120" text-anchor="middle" font-size="34" letter-spacing="10" class="sans" fill="#1e2a38" font-weight="bold">SELATAN JAWA</text>
      <!-- boat -->
      <g id="boat">
        <path d="M300 388 Q360 410 420 388 L400 372 L320 372 Z" fill="#8a4a2b" stroke="#1e2a38" stroke-width="3"/>
        <line x1="360" y1="372" x2="360" y2="300" stroke="#1e2a38" stroke-width="4"/>
        <path d="M364 306 L416 364 L364 364 Z" fill="#efe7d3" stroke="#1e2a38" stroke-width="3"/>
        <path d="M356 314 L318 364 L356 364 Z" fill="#c0442e" opacity=".85"/>
      </g>
      <!-- waves: 3 layers, shifted by JS -->
      <g id="waves1"></g>
      <!-- depth gauge ruler -->
      <g id="ruler">
        <line x1="600" y1="560" x2="600" y2="1060" stroke="#1e2a38" stroke-width="3"/>
        <g id="rticks"></g>
        <path id="rptr" d="M600 560 L580 550 L580 570 Z" fill="#c0442e"/>
        <text x="592" y="540" text-anchor="end" font-size="14" class="sans" fill="#8a7f6a">0</text>
        <text x="592" y="1075" text-anchor="end" font-size="14" class="sans" fill="#8a7f6a">7.000m</text>
      </g>
      <text id="depth" x="240" y="700" font-size="104" font-weight="700" fill="#ffffff" font-variant-numeric="tabular-nums">0</text>
      <text x="240" y="760" font-size="30" class="sans" fill="#cfe3f2">meter di bawah laut</text>
      <text class="cap" x="320" y="1180" text-anchor="middle" font-size="20">dasarnya lebih dalam daripada Semeru tingginya</text>
    </svg>
  </div>

  <!-- S2: potongan bumi -->
  <div class="lyr hidden" id="s2">
    <div class="tag">[ POTONGAN BUMI ] <b>02/06</b></div>
    <svg width="720" height="1280" viewBox="0 0 720 1280" id="svg2">
      <rect x="0" y="300" width="720" height="140" fill="#3a7ca5"/>
      <g id="waves2"></g>
      <!-- Eurasia plate -->
      <path d="M0 540 L720 495 L720 790 L0 830 Z" fill="#b8a276" stroke="#1e2a38" stroke-width="4"/>
      <!-- strata -->
      <path d="M0 640 L720 600 L720 640 L0 685 Z" fill="#a08a60" opacity=".7"/>
      <path d="M0 730 L720 695 L720 725 L0 762 Z" fill="#8a744e" opacity=".6"/>
      <!-- Indo-Australia slab diving -->
      <path d="M0 880 L520 850 L640 940 L540 1130 L0 1030 Z" fill="#7a6a52" stroke="#1e2a38" stroke-width="4"/>
      <path d="M0 960 L470 935 L560 1000 L480 1090 L0 1000 Z" fill="#665540" opacity=".7"/>
      <!-- trench notch + dashed marker -->
      <path d="M340 845 Q360 880 380 842" stroke="#1e2a38" stroke-width="4" fill="none"/>
      <path d="M300 852 Q360 900 430 848" stroke="#c0442e" stroke-width="5" fill="none" stroke-dasharray="14 10"/>
      <!-- leader + trench label (on tan plate, clear zone) -->
      <line x1="500" y1="700" x2="405" y2="840" stroke="#c0442e" stroke-width="2.5"/>
      <text x="510" y="690" font-size="22" class="sans" fill="#c0442e" font-weight="bold">PALUNG JAWA</text>
      <text x="510" y="716" font-size="17" class="sans" fill="#c0442e">±7.000 m</text>
      <text x="60" y="595" font-size="19" class="sans" fill="#1e2a38" letter-spacing="2">LEMPENG EURASIA</text>
      <text x="60" y="1170" font-size="19" class="sans" fill="#1e2a38" letter-spacing="2">LEMPENG INDO-AUSTRALIA</text>
      <text class="cap" x="360" y="1128" text-anchor="middle" font-size="22">lempeng selatan menunjam ke bawah pulau — terus-menerus</text>
      <text x="50" y="345" font-size="17" class="sans" fill="#efe7d3" letter-spacing="3">LAUT JAWA</text>
      <!-- fish -->
      <g id="fish">
        <path d="M0 0 Q14 -10 30 0 Q14 10 0 0 Z M30 0 L42 -8 L42 8 Z" fill="#1e2a38" opacity=".8"/>
      </g>
      <!-- bubbles -->
      <g id="bubbles"></g>
      <!-- convergence arrows -->
      <g id="arrL"><rect x="60" y="1210" width="120" height="10" fill="#c0442e"/><path d="M180 1200 L212 1215 L180 1230 Z" fill="#c0442e"/></g>
      <g id="arrR"><rect x="540" y="1210" width="120" height="10" fill="#c0442e"/><path d="M540 1200 L508 1215 L540 1230 Z" fill="#c0442e"/></g>
    </svg>
  </div>

  <!-- S3: penggaris waktu -->
  <div class="lyr hidden" id="s3">
    <div class="tag">[ KECEPATAN ] <b>03/06</b></div>
    <svg width="720" height="1280" viewBox="0 0 720 1280" id="svg3">
      <text x="360" y="360" text-anchor="middle" font-size="140" font-weight="700" fill="#c0442e" font-variant-numeric="tabular-nums" id="cmnum">6,5</text>
      <text x="360" y="430" text-anchor="middle" font-size="30" class="sans" fill="#1e2a38" letter-spacing="4">SENTIMETER PER TAHUN</text>
      <text x="360" y="480" text-anchor="middle" font-size="22" class="sans" fill="#8a7f6a">kecepatan kuku tanganmu tumbuh</text>
      <!-- ruler track -->
      <rect x="60" y="640" width="600" height="26" fill="none" stroke="#1e2a38" stroke-width="3"/>
      <rect id="rfill" x="62" y="643" width="0" height="20" fill="#2b5f8a"/>
      <g id="rticks3"></g>
      <path id="rmark" d="M62 610 L52 590 L72 590 Z" fill="#c0442e"/>
      <text x="60" y="700" font-size="16" class="sans" fill="#8a7f6a">0 th</text>
      <text x="660" y="700" text-anchor="end" font-size="16" class="sans" fill="#8a7f6a">100 th</text>
      <text id="yr" x="360" y="800" text-anchor="middle" font-size="64" font-weight="700" fill="#1e2a38" font-variant-numeric="tabular-nums">0 tahun</text>
      <text id="mtr" x="360" y="890" text-anchor="middle" font-size="44" fill="#2b5f8a" font-weight="bold">= 0 meter</text>
      <!-- phone for scale -->
      <g id="phone">
        <rect x="280" y="980" width="160" height="260" rx="18" fill="none" stroke="#1e2a38" stroke-width="4"/>
        <text x="360" y="1120" text-anchor="middle" font-size="15" class="sans" fill="#8a7f6a">tinggi HP ≈ 15cm</text>
      </g>
      <text class="cap" x="360" y="940" text-anchor="middle" font-size="0"> </text>
    </svg>
  </div>

  <!-- S4: pegas + snap -->
  <div class="lyr hidden" id="s4">
    <div class="tag">[ GEMPA ] <b>04/06</b></div>
    <svg width="720" height="1280" viewBox="0 0 720 1280" id="svg4">
      <text x="360" y="380" text-anchor="middle" font-size="72" font-weight="700" fill="#1e2a38" id="b1" opacity="0">GEMPA BUKAN</text>
      <text x="360" y="480" text-anchor="middle" font-size="72" font-weight="700" fill="#1e2a38" id="b2" opacity="0">KEJADIAN<tspan fill="#c0442e">.</tspan></text>
      <text x="360" y="640" text-anchor="middle" font-size="84" font-weight="700" fill="#c0442e" id="b3" opacity="0">GERAKAN.</text>
      <g id="quakeviz"></g>
      <text id="stress" x="360" y="920" text-anchor="middle" font-size="20" class="sans" fill="#8a7f6a" letter-spacing="4" opacity="0">TEKANAN MENUMPUK</text>
      <text class="cap" x="360" y="1180" text-anchor="middle" font-size="23" id="cap4" opacity="0">tekunan bertahun-tahun dilepaskan dalam hitungan detik</text>
    </svg>
  </div>

  <!-- S5: peta busur -->
  <div class="lyr hidden" id="s5">
    <div class="tag">[ PETA ] <b>05/06</b></div>
    <svg width="720" height="1280" viewBox="0 0 720 1280" id="svg5">
      <text x="360" y="170" text-anchor="middle" font-size="26" class="sans" fill="#1e2a38" letter-spacing="4" id="h5" opacity="0">BUSUR GEMPA SELATAN JAWA</text>
      <g id="map"></g>
      <text class="cap" x="360" y="1180" text-anchor="middle" font-size="23">pulau yang kau injak bergerak setiap detik</text>
    </svg>
  </div>

  <!-- S6: outro -->
  <div class="lyr hidden" id="s6">
    <div class="tag">[ PENUTUP ] <b>06/06</b></div>
    <svg width="720" height="1280" viewBox="0 0 720 1280" id="svg6">
      <text x="360" y="420" text-anchor="middle" font-size="70" font-weight="700" fill="#1e2a38" id="o1" opacity="0">BUMI TIDAK DIAM<tspan fill="#c0442e">.</tspan></text>
      <text x="360" y="560" text-anchor="middle" font-size="26" font-style="italic" fill="#8a7f6a" id="o2" opacity="0">kita yang jarang merasakannya</text>
      <g id="island6" opacity="0">
        <path d="M160 700 Q250 660 360 680 Q480 700 560 690 Q600 685 610 700 Q500 730 360 725 Q230 722 160 700 Z" fill="#c8b78f" stroke="#1e2a38" stroke-width="3"/>
        <path d="M340 680 L352 610 L392 622 Q370 640 386 672 Z" fill="#7a6a52" stroke="#1e2a38" stroke-width="2.5"/>
      </g>
      <g id="waves6"></g>
    </svg>
  </div>
</div>
<script>
const W=720,H=1280,DUR=40;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
const pop=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const $=id=>document.getElementById(id);
const E={s1:$('s1'),s2:$('s2'),s3:$('s3'),s4:$('s4'),s5:$('s5'),s6:$('s6'),grat:$('grat'),stage:$('stage')};

// wave path generator: repeating sine pattern width 1440, shift by JS
function waveY(y,amp){let d=`M-80 ${y}`;for(let x=-80;x<1440;x+=80){d+=` Q${x+40} ${y-amp} ${x+80} ${y}`;}return d+' V1600 H-80 Z';}
function makeWaves(id,base,amp,col1,col2){
  $(id).innerHTML=
   `<path id="${id}a" d="${waveY(base,amp)}" fill="${col1}" opacity=".9"/>`+
   `<path id="${id}b" d="${waveY(base+26,amp*1.3)}" fill="${col2}" opacity=".95"/>`;
}
makeWaves('waves1',420,10,'#3a7ca5','#2b5f8a');
makeWaves('waves2',300,8,'#3a7ca5','#2b5f8a');
makeWaves('waves6',900,10,'#3a7ca5','#2b5f8a');

// ruler ticks S1 (depth gauge)
{let s='';for(let i=0;i<=10;i++){const y=560+i*50;s+=`<line x1="600" y1="${y}" x2="${i%2?588:580}" y2="${y}" stroke="#1e2a38" stroke-width="2"/>`;}$('rticks').innerHTML=s;}

// S3 ruler ticks (100 yr = 600px, tick per 20yr=120px)
{let s='';for(let i=0;i<=5;i++){const x=60+i*120;s+=`<line x1="${x}" y1="636" x2="${x}" y2="670" stroke="#1e2a38" stroke-width="2"/>`;}$('rticks3').innerHTML=s;}

// S5 map
const PX=lon=>(lon-93)/27*640+40, PY=lat=>(6-lat)/18*700+190;
const jawa=[[105.1,-5.9],[106.5,-6.0],[108,-6.2],[110,-6.4],[112,-6.7],[114.4,-6.9],[115.5,-7.7],[114.4,-8.2],[110,-8.2],[108,-7.8],[106,-7.4],[104.8,-7.0]];
const jpath=jawa.map((p,i)=>(i?'L':'M')+PX(p[0])+' '+PY(p[1])).join(' ')+' Z';
$('map').innerHTML=`
  <path d="M60 320 Q130 460 231 660" stroke="#8a7f6a" stroke-width="3" fill="none" opacity=".5" stroke-dasharray="2 6"/>
  <text class="sans" x="46" y="304" font-size="16" fill="#8a7f6a" letter-spacing="1" transform="rotate(52 46 304)">SUMATRA</text>
  <ellipse cx="660" cy="${PY(-8.5)}" rx="20" ry="9" fill="#c8b78f" stroke="#1e2a38" stroke-width="2"/>
  <ellipse cx="694" cy="${PY(-8.15)}" rx="12" ry="7" fill="#c8b78f" stroke="#1e2a38" stroke-width="2"/>
  <path d="${jpath}" fill="#c8b78f" stroke="#1e2a38" stroke-width="3" id="jawa5" opacity="0"/>
  <path id="trench5" d="M${PX(101.5)} ${PY(-10.0)} Q ${PX(109)} ${PY(-11.0)} ${PX(116.5)} ${PY(-9.9)}" stroke="#c0442e" stroke-width="4" fill="none" stroke-dasharray="12 9" opacity="0"/>
  <text class="sans" x="60" y="${PY(-10.6)}" font-size="17" fill="#c0442e" font-weight="bold" id="plbl" opacity="0">PALUNG JAWA</text>
  <text class="sans" x="${PX(106.6)}" y="${PY(-6.9)}" font-size="19" fill="#1e2a38" letter-spacing="2" id="jlbl" opacity="0">PULAU JAWA</text>
  <g id="compass" opacity="0">
    <circle cx="640" cy="250" r="30" fill="none" stroke="#1e2a38" stroke-width="2.5"/>
    <path d="M640 228 L648 258 L640 250 L632 258 Z" fill="#c0442e"/>
    <text x="640" y="215" text-anchor="middle" font-size="16" class="sans" fill="#1e2a38">U</text>
  </g>
  <g id="quakes"></g>`;
const QUAKES=[
  {lon:95.9,lat:3.3,y:2004,m:9.1,n:'ACEH 2004 M9.1',dx:56,dy:6},
  {lon:99.9,lat:-7.9,y:2009,m:7.0,n:'TASIKMALAYA 2009 M7.0',dx:-60,dy:52},
  {lon:107.7,lat:-9.4,y:2006,m:7.7,n:'PANGANDARAN 2006 M7.7',dx:22,dy:-16},
  {lon:112.6,lat:-10.3,y:1994,m:7.8,n:'BANYUWANGI 1994 M7.8',dx:-234,dy:-44},
];

function render(t){
  E.grat.style.transform=`translate(${-(t*6)%72}px,${-(t*4)%72}px)`;
  ['s1','s2','s3','s4','s5','s6'].forEach(k=>E[k].style.opacity=0);
  let shake=0;
  const waveShift=(t*46)%80, waveShift2=(t*80)%80;

  if(t<6.5){ // S1
    E.s1.style.opacity=1;
    const p=seg(t,1,6.2), d=Math.floor(7192*Math.pow(p,1.7));
    $('depth').textContent=d.toLocaleString('id-ID');
    $('rptr').setAttribute('transform',`translate(0,${p*500})`);
    $('boat').setAttribute('transform',`translate(0,${Math.sin(t*2.2)*7}) rotate(${Math.sin(t*1.7)*3} 360 380)`);
    $('waves1a').setAttribute('transform',`translate(${-waveShift},0)`);
    $('waves1b').setAttribute('transform',`translate(${-waveShift2+40},0)`);
    $('cloud1').setAttribute('transform',`translate(${(t*10)%720},0)`);
    $('depth').setAttribute('fill', t>5?'#bfe0f5':'#ffffff');
  }
  else if(t<14){ // S2
    E.s2.style.opacity=1;
    const inP=ease(seg(t,6.5,7.4));
    E.s2.style.transform=`scale(${lerp(1.1,1,inP)})`;
    $('waves2a').setAttribute('transform',`translate(${-waveShift},0)`);
    $('waves2b').setAttribute('transform',`translate(${-waveShift2+40},0)`);
    $('fish').setAttribute('transform',`translate(${lerp(120,540,seg(t,7.5,13.5))},470) ${seg(t,12.8,13.2)>0?'scale(-1,1) translate(-870,0)':''}`);
    let bub='';
    for(let i=0;i<5;i++){
      const bp=((t*0.45+i*0.2)%1);
      bub+=`<circle cx="${362+Math.sin(bp*9+i)*14}" cy="${830-bp*330}" r="${3+bp*5}" fill="none" stroke="#efe7d3" stroke-width="2" opacity="${(1-bp)*.8}"/>`;
    }
    $('bubbles').innerHTML=bub;
    $('arrL').setAttribute('transform',`translate(${(t*22)%34},0)`);
    $('arrR').setAttribute('transform',`translate(${-(t*22)%34},0)`);
  }
  else if(t<22){ // S3
    E.s3.style.opacity=1;
    const intro=pop(seg(t,14,14.8));
    E.s3.style.transform=`scale(${lerp(.94,1,intro)})`;
    const years=Math.floor(100*seg(t,15.8,21));
    $('yr').textContent=years+' tahun';
    const mtr=6.5*years/100;
    $('mtr').textContent='= '+(mtr<10?mtr.toFixed(1).replace('.',','):Math.round(mtr))+' meter';
    $('rfill').setAttribute('width',years*6);
    $('rmark').setAttribute('transform',`translate(${years*6},0)`);
    $('cmnum').setAttribute('fill', t>15.8?'#c0442e':'#1e2a38');
  }
  else if(t<30){ // S4
    E.s4.style.opacity=1;
    $('stress').style.opacity=seg(t,22,24);
    $('b1').style.opacity=pop(seg(t,22.2,23)); $('b2').style.opacity=pop(seg(t,22.6,23.4));
    const snap=t>26.5;
    $('b3').style.opacity=snap?pop(seg(t,26.8,27.6)):0;
    $('cap4').style.opacity=pop(seg(t,28.4,29.4));
    // spring compression then snap
    const st=seg(t,22,26.5);
    const comp=lerp(120,40,st);
    let jx=0;
    if(snap){ jx=(1-ease(seg(t,26.5,27.2)))*50; shake=(1-ease(seg(t,26.5,27.3)))*13; }
    let zig=`M${300-comp/2+ (snap?-jx:0)} 760`;
    const n=8,zw=comp/n;
    for(let i=0;i<n;i++)zig+=` L${300-comp/2+(snap?-jx:0)+zw*(i+.5)} ${760+(i%2?26:-26)}`;
    zig+=` L${420-comp/2+(snap?-jx:0)} 760`;
    let viz=`<rect x="80" y="710" width="${200-(snap?jx*0.5:0)-comp*0}" height="100" fill="#b8a276" stroke="#1e2a38" stroke-width="4" transform="translate(${snap?-jx:Math.sin(t*30)*st*4},0)"/>`+
      `<rect x="${440+(snap?jx:0)-Math.sin(t*30)*st*4}" y="710" width="200" height="100" fill="#7a6a52" stroke="#1e2a38" stroke-width="4"/>`+
      `<path d="${zig}" stroke="#c0442e" stroke-width="5" fill="none"/>`;
    if(snap){
      for(let i=0;i<4;i++){
        const wp=seg(t,26.5+i*.3,29.6);
        if(wp>0&&wp<1)viz+=`<circle cx="360" cy="760" r="${wp*700}" stroke="#c0442e" stroke-width="${4*(1-wp)+1}" fill="none" opacity="${(1-wp)*.6}"/>`;
      }
    }
    $('quakeviz').innerHTML=viz;
    $('stress').textContent=snap?'':'TEKANAN MENUMPUK'+'.'.repeat(1+Math.floor(t*2)%3);
  }
  else if(t<36){ // S5
    E.s5.style.opacity=1;
    const inP=ease(seg(t,30,30.9));
    E.s5.style.transform=`scale(${lerp(1.09,1,inP)})`;
    $('h5').style.opacity=pop(seg(t,30.1,30.7));
    $('jawa5').style.opacity=pop(seg(t,30.4,31));
    $('trench5').style.opacity=pop(seg(t,31.2,31.7));
    $('plbl').style.opacity=pop(seg(t,31.4,31.9));
    $('jlbl').style.opacity=pop(seg(t,30.8,31.3));
    $('compass').style.opacity=pop(seg(t,30.6,31.2));
    let q='';
    QUAKES.forEach((k,i)=>{
      const p=pop(seg(t,31.9+i*.55,32.6+i*.55));
      if(p<=0)return;
      const r=(10+(k.m-7)*17)*p, x=PX(k.lon), y=PY(k.lat);
      q+=`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#c0442e" stroke-width="3.5"/>
          <circle cx="${x}" cy="${y}" r="5" fill="#c0442e"/>
          <text class="sans" x="${x+k.dx}" y="${y+k.dy}" font-size="15" fill="#c0442e" font-weight="bold">${k.n}</text>`;
    });
    $('quakes').innerHTML=q;
  }
  else{ // S6
    E.s6.style.opacity=1;
    const q=pop(seg(t,36.3,37.1));
    const slam=1+.3*(1-ease(seg(t,36.3,36.9)));
    E.s6.style.transform=`scale(${lerp(slam,1,ease(seg(t,36.9,37.6)))})`;
    $('o1').style.opacity=q; $('o2').style.opacity=pop(seg(t,37.8,38.6));
    $('island6').style.opacity=pop(seg(t,36.8,37.6));
    $('island6').setAttribute('transform',`translate(0,${Math.sin(t*2)*5})`);
    $('waves6a').setAttribute('transform',`translate(${-waveShift},0)`);
    $('waves6b').setAttribute('transform',`translate(${-waveShift2+40},0)`);
  }
  E.stage.style.transform=shake?`translate(${(Math.random()*2-1)*shake}px,${(Math.random()*2-1)*shake}px)`:'';
}

const qp=new URLSearchParams(location.search);
if(qp.has('t')){ render(parseFloat(qp.get('t'))); }
else{
  let t0=performance.now();
  function loop(now){ const t=((now-t0)/1000)%DUR; render(t); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
}
window.__seek=t=>render(t);
</script>
